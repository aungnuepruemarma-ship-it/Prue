[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncp"
version = "0.1.0"
description = "Nexus Computing Platform reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ncp*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
