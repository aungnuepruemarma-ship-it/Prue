[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncp"
version = "0.1.0"
description = "Nexus Computing Platform reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyyaml"]
api = ["fastapi>=0.104", "uvicorn>=0.24"]
config = ["pyyaml>=6.0"]
llm = ["anthropic>=0.8"]

[project.scripts]
ncp = "ncp.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ncp*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]
