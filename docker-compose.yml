version: '3.8'

services:
  ncp:
    build: .
    container_name: ncp-runtime
    environment:
      - NCP_STORAGE_BACKEND=postgresql
      - NCP_DATABASE_URL=postgresql://ncp:ncp@postgres:5432/ncp
      - NCP_REDIS_URL=redis://redis:6379
      - NCP_VECTOR_STORE_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    container_name: ncp-postgres
    environment:
      POSTGRES_USER: ncp
      POSTGRES_PASSWORD: ncp
      POSTGRES_DB: ncp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: ncp-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ncp-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  neo4j:
    image: neo4j:5-community
    container_name: ncp-neo4j
    environment:
      NEO4J_AUTH: neo4j/ncp-password
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  prometheus:
    image: prom/prometheus:latest
    container_name: ncp-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: ncp-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  prometheus_data:
  grafana_data:
