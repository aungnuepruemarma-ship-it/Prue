runtime:
  workers: 8
  max_concurrent_tasks: 64
  task_timeout_seconds: 300
  graceful_shutdown_seconds: 30

scheduler:
  workers: 8
  queue_type: priority
  max_queue_size: 10000

events:
  queue_size: 100000
  dispatch_mode: async
  persistent: true

planner:
  beam_width: 32
  max_plan_depth: 10
  decomposition_threshold: 5

memory:
  working_size: 1024
  session_ttl_seconds: 3600
  consolidation_interval_seconds: 300
